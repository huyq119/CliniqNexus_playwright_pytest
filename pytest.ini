[tool:pytest]
# pytest配置文件

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --html=reports/report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/report.json

# 标记定义
markers =
    smoke: 冒烟测试
    regression: 回归测试
    api: API测试
    ui: UI测试
    e2e: 端到端测试
    slow: 慢速测试
    skip: 跳过测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 最小版本要求
minversion = 6.0

# 测试超时
timeout = 300

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
