        playwright install chromium --with-deps
    
    - name: Run Playwright tests on Chromium
      run: |
        pytest tests/ui/ --html=reports/chromium-report.html --self-contained-html --browser chromium
      env:
        CI: true
    
    - name: Upload Chromium test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: chromium-test-results
        path: |
          reports/chromium-report.html
          screenshots/
        retention-days: 30

  test-firefox:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install firefox --with-deps
    
    - name: Run Playwright tests on Firefox
      run: |
        pytest tests/ui/ --html=reports/firefox-report.html --self-contained-html --browser firefox
      env:
        CI: true
    
    - name: Upload Firefox test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: firefox-test-results
        path: |
          reports/firefox-report.html
          screenshots/
        retention-days: 30

  test-webkit:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
