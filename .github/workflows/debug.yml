name: Debug Tests

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Test file to run (e.g., tests/ui/test_login_page.py)'
        required: false
        default: 'tests/ui/test_login_page.py'
      test_function:
        description: 'Specific test function to run'
        required: false
        default: ''
      headless:
        description: 'Run in headless mode'
        type: boolean
        default: false

jobs:
  debug:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps
    
    - name: Debug test run
      run: |
        if [ -n "${{ github.event.inputs.test_function }}" ]; then
          pytest ${{ github.event.inputs.test_file }}::${{ github.event.inputs.test_function }} --html=reports/debug-report.html --self-contained-html --tb=long -v -s
        else
          pytest ${{ github.event.inputs.test_file }} --html=reports/debug-report.html --self-contained-html --tb=long -v -s
        fi
      env:
        CI: true
        TEST_ENV: test
        HEADLESS: ${{ github.event.inputs.headless }}
        DEBUG: true
    
    - name: Upload debug results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: debug-test-results
        path: |
          reports/debug-report.html
          screenshots/
        retention-days: 7
    
    - name: Upload browser logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: browser-logs
        path: |
          playwright-report/
        retention-days: 7

